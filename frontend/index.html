<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent MVP</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 640px;
      margin-top: 40px;
      padding: 24px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      background: #334155;
      color: #e2e8f0;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .status-listening .status-dot { background: #22c55e; }
    .status-thinking .status-dot { background: #eab308; }
    .status-speaking .status-dot { background: #3b82f6; }
    .status-ended .status-dot { background: #ef4444; }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      flex: 1;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-start {
      background: var(--primary);
      color: #fff;
    }
    .btn-start:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .btn-end {
      background: var(--danger);
      color: #fff;
    }
    .btn-end:hover:not(:disabled) {
      background: var(--danger-hover);
    }
    .captions-box {
      min-height: 160px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg {
      margin-bottom: 8px;
    }
    .msg-user { color: #60a5fa; }
    .msg-agent { color: #34d399; }
    .msg-system { color: var(--text-muted); font-style: italic; }
    .msg-tool { color: #f59e0b; font-size: 13px; font-family: monospace; }
    .msg-error { color: #f87171; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Voice Agent MVP</h1>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Idle</span>
    </div>

    <div class="controls">
      <button id="btnStart" class="btn-start">Start Call</button>
      <button id="btnEnd" class="btn-end" disabled>End Call</button>
    </div>

    <h3>Captions & Transcript</h3>
    <div id="captions" class="captions-box">
      <div class="msg msg-system">Press "Start Call" to begin speaking.</div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
